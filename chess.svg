<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Chess game preview</title>
  <desc id="desc">A dark chess game screen with local and online play buttons.</desc>
  <defs><radialGradient id="dark" cx="50%" cy="35%"><stop stop-color="#302519"/><stop offset="1" stop-color="#17120e"/></radialGradient></defs>
  <rect width="800" height="500" fill="url(#dark)"/>
  <text x="400" y="175" text-anchor="middle" fill="#f5eedc" font-family="Georgia,serif" font-size="76" letter-spacing="8">CHESS</text>
  <text x="400" y="220" text-anchor="middle" fill="#806f59" font-family="Georgia,serif" font-size="18" letter-spacing="3">CHOOSE YOUR MODE</text>
  <rect x="270" y="273" width="260" height="54" rx="13" fill="#302619" stroke="#533d19" stroke-width="2"/>
  <rect x="270" y="347" width="260" height="54" rx="13" fill="#302619" stroke="#533d19" stroke-width="2"/>
  <text x="400" y="307" text-anchor="middle" fill="#e8deca" font-family="Georgia,serif" font-size="19" letter-spacing="2">PLAY LOCAL</text>
  <text x="400" y="381" text-anchor="middle" fill="#e8deca" font-family="Georgia,serif" font-size="19" letter-spacing="2">PLAY ONLINE</text>
</svg>
